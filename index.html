<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mealy">
<title>Mealy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 id="title">Mealy</h1>
  <button class="sync" id="syncBtn" data-act="settings" aria-label="Sync and settings"><i id="syncDot"></i><span id="syncText">Local</span></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="plan"><span>🗓️</span>Plan</button>
  <button data-act="tab" data-tab="recipes"><span>📖</span>Recipes</button>
  <button data-act="tab" data-tab="shop"><span>🛒</span>Shop</button>
  <button data-act="tab" data-tab="history"><span>🕘</span>History</button>
</nav>
<div id="overlay" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" hidden></div>
<noscript>Mealy needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
