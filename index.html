<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mealy">
<title>Mealy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 1024 1024" width="300" height="300"><g transform="translate(-78 30)" fill="none" stroke="#b79f6a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><g class="cart"><path d="M176 262H262L340 400"/><path d="M340 400H840C840 520.0 745.0 606.4 640.0 611.2V640H540.0V611.2C435.0 606.4 340 520.0 340 400Z"/><g class="wind w0"><path class="base" d="M485 349C507 301 463 264 485 213"/><g class="drift d0"><path d="M485 349C507 301 463 264 485 213"/></g></g><g class="wind w1"><path class="base" d="M590 349C612 301 568 264 590 213"/><g class="drift d1"><path d="M590 349C612 301 568 264 590 213"/></g></g><g class="wind w2"><path class="base" d="M695 349C717 301 673 264 695 213"/><g class="drift d2"><path d="M695 349C717 301 673 264 695 213"/></g></g><g class="wheel"><circle cx="500" cy="716" r="34"/><path class="spoke" d="M500 716V690"/></g><g class="wheel"><circle cx="690" cy="716" r="34"/><path class="spoke" d="M690 716V690"/></g></g></g></svg></div>
<script>
(function () {
  var s = document.getElementById('splash');
  var seen = false, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { seen = sessionStorage.getItem('mealy:splash'); sessionStorage.setItem('mealy:splash', '1'); } catch (e) {}
  if (seen || reduce) { s.remove(); return; }
  setTimeout(function () { s.classList.add('out'); }, 1900);
  setTimeout(function () { s.remove(); }, 2250);
})();
</script>
<header class="top">
  <h1 id="title">Mealy</h1>
  <button class="sync" id="syncBtn" data-act="settings" aria-label="Sync and settings"><i id="syncDot"></i><span id="syncText">Local</span></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="plan">Plan</button>
  <button data-act="tab" data-tab="recipes">Recipes</button>
  <button data-act="tab" data-tab="shop">Shop</button>
  <button data-act="tab" data-tab="history">History</button>
</nav>
<div id="overlay" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" hidden></div>
<noscript>Mealy needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
